[package]
name = "chroma-lite-installer"
# The installer's own version doesn't matter: it shows and installs the app's
# version, which build.rs reads from ../src-tauri/Cargo.toml.
version = "0.1.0"
edition = "2021"
description = "Installer and uninstaller for Chroma Lite"
license = "MIT"
publish = false

[[bin]]
name = "chroma-lite-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
fastrand = "2"

# Declared for every target (not just cfg(windows)) so the Windows code can be
# type-checked from Linux with `cargo check --features win-check`. The FFI
# declarations compile anywhere; they only link on Windows.
[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[build-dependencies]
winresource = "0.1"

[features]
# Type-check another OS's real code from Linux:
#   cargo check --features win-check
#   cargo check --features mac-check
win-check = []
mac-check = []

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
