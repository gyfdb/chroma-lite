[package]
name = "chroma-lite"
version = "0.1.0"
description = "Synapse-free lighting for Razer peripherals"
edition = "2021"
license = "MIT"

[lib]
name = "chroma_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"

# local time for the time-of-day effect; Windows asks the OS directly instead
[target.'cfg(not(windows))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[profile.dev]
incremental = true

# small tray app, so favor size. the hot paths are USB I/O and sleeping, not
# CPU work. fat LTO for cross-crate inlining, abort on panic, no unwind tables
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
